name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Esto añade un botón en GitHub para que puedas probarlo a mano cuando quieras

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET "https://lffmkpexmtjwtvlgvkcj.supabase.co/rest/v1/herramientas?select=id&limit=1" \
            -H "apikey: sb_publishable_2GbOzXCVwdEOeZj62jhTPA_cuWUn2Bs" \
            -H "Authorization: Bearer sb_publishable_2GbOzXCVwdEOeZj62jhTPA_cuWUn2Bs"
          echo "Ping completado con éxito."